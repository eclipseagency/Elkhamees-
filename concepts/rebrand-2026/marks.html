<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الخميس — دراسة العلامة</title>
<style>
  body{ margin:0; background:#0B0B0C; color:#EDE7DC; font:14px -apple-system,Arial,sans-serif; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:0; }
  .cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center;
         border:1px solid #1c1c1e; position:relative; }
  .cell span{ position:absolute; bottom:8px; right:10px; font-size:10px; color:#5a5651; letter-spacing:.5px; }
  svg{ width:56%; height:56%; overflow:visible; }
  .small svg{ width:22%; height:22%; }
</style>
</head>
<body>
<div class="grid">

  <!-- A · خ كشريط واحد داخل قرص -->
  <div class="cell"><span>A</span>
  <svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="92" fill="none" stroke="#C9A227" stroke-width="2"/>
    <!-- الشريط: كتف علوي ثم كأس عميق -->
    <path d="M148 74 L84 74 C58 74 46 92 46 112 C46 134 64 148 88 148 C118 148 140 132 152 112"
          fill="none" stroke="#C9A227" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- النقطة: معيّن -->
    <path d="M100 34 L112 48 L100 62 L88 48 Z" fill="#C9A227"/>
  </svg></div>

  <!-- B · خ بتباين سماكة، بلا إطار -->
  <div class="cell"><span>B</span>
  <svg viewBox="0 0 200 200">
    <path d="M156 70 C156 78 150 82 142 82 L86 82 C62 82 52 96 52 112
             C52 132 70 144 92 144 C120 144 142 128 154 106
             C150 138 122 158 90 158 C58 158 34 138 34 110
             C34 84 56 66 88 66 L142 66 C150 66 156 64 156 70 Z" fill="#C9A227"/>
    <path d="M100 28 L114 44 L100 60 L86 44 Z" fill="#C9A227"/>
  </svg></div>

  <!-- C · خ محفور داخل معيّن (خاتم الدار) -->
  <div class="cell"><span>C</span>
  <svg viewBox="0 0 200 200">
    <path d="M100 8 L192 100 L100 192 L8 100 Z" fill="none" stroke="#C9A227" stroke-width="2"/>
    <path d="M100 30 L170 100 L100 170 L30 100 Z" fill="none" stroke="#C9A227" stroke-width="1" opacity=".45"/>
    <path d="M138 88 L86 88 C68 88 60 100 60 112 C60 128 74 138 92 138 C112 138 128 128 138 112"
          fill="none" stroke="#C9A227" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 58 L109 68 L100 78 L91 68 Z" fill="#C9A227"/>
  </svg></div>

  <!-- D · خماسي: تاج بخمسة أوجه + خ -->
  <div class="cell"><span>D</span>
  <svg viewBox="0 0 200 200">
    <g stroke="#C9A227" stroke-width="2" fill="none">
      <path d="M100 20 L176 75 L147 164 L53 164 L24 75 Z"/>
      <path d="M100 20 L100 92 M176 75 L100 92 M147 164 L100 92 M53 164 L100 92 M24 75 L100 92" opacity=".4"/>
    </g>
    <path d="M136 104 L88 104 C72 104 66 114 66 124 C66 136 78 144 92 144 C110 144 124 134 132 120"
          fill="none" stroke="#C9A227" stroke-width="9" stroke-linecap="round"/>
    <path d="M100 68 L108 78 L100 88 L92 78 Z" fill="#C9A227"/>
  </svg></div>

  <!-- E · الشريط وحده، أكثر انفتاحاً -->
  <div class="cell"><span>E</span>
  <svg viewBox="0 0 200 200">
    <path d="M162 76 L82 76 C54 76 40 96 40 116 C40 140 62 154 88 154 C122 154 148 134 160 106"
          fill="none" stroke="#C9A227" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="42" r="9" fill="#C9A227"/>
  </svg></div>

  <!-- F · خ مزدوج متعاكس (ختم) -->
  <div class="cell"><span>F</span>
  <svg viewBox="0 0 200 200">
    <g fill="none" stroke="#C9A227" stroke-width="10" stroke-linecap="round">
      <path d="M150 84 L86 84 C64 84 54 98 54 112 C54 130 72 140 92 140 C116 140 136 126 146 108"/>
      <path d="M50 116 L114 116 C136 116 146 102 146 88 C146 70 128 60 108 60 C84 60 64 74 54 92"
            opacity=".35"/>
    </g>
    <path d="M100 30 L110 42 L100 54 L90 42 Z" fill="#C9A227"/>
  </svg></div>

  <!-- G · حجر بخمسة أوجه، الخ محفورة سالباً -->
  <div class="cell"><span>G</span>
  <svg viewBox="0 0 200 200">
    <defs><clipPath id="pent"><path d="M100 16 L180 74 L149 170 L51 170 L20 74 Z"/></clipPath></defs>
    <path d="M100 16 L180 74 L149 170 L51 170 L20 74 Z" fill="#C9A227"/>
    <g clip-path="url(#pent)">
      <path d="M140 106 L88 106 C72 106 64 116 64 126 C64 138 76 146 92 146 C110 146 126 136 134 122"
            fill="none" stroke="#0B0B0C" stroke-width="11" stroke-linecap="round"/>
      <path d="M100 70 L109 80 L100 90 L91 80 Z" fill="#0B0B0C"/>
    </g>
  </svg></div>

  <!-- H · قوس مفرد، أقصى تجريد -->
  <div class="cell"><span>H</span>
  <svg viewBox="0 0 200 200">
    <path d="M158 72 L80 72 C50 72 34 94 34 118 C34 146 60 162 92 162"
          fill="none" stroke="#C9A227" stroke-width="16" stroke-linecap="round"/>
    <path d="M100 30 L113 45 L100 60 L87 45 Z" fill="#C9A227"/>
  </svg></div>

</div>

<!-- اختبار الحجم الصغير: 3 مم على مشغولة -->
<div class="grid small">
  <div class="cell"><span>A · 3mm</span>
  <svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="92" fill="none" stroke="#C9A227" stroke-width="2"/>
    <path d="M148 74 L84 74 C58 74 46 92 46 112 C46 134 64 148 88 148 C118 148 140 132 152 112"
          fill="none" stroke="#C9A227" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 34 L112 48 L100 62 L88 48 Z" fill="#C9A227"/>
  </svg></div>
  <div class="cell"><span>B · 3mm</span>
  <svg viewBox="0 0 200 200">
    <path d="M156 70 C156 78 150 82 142 82 L86 82 C62 82 52 96 52 112
             C52 132 70 144 92 144 C120 144 142 128 154 106
             C150 138 122 158 90 158 C58 158 34 138 34 110
             C34 84 56 66 88 66 L142 66 C150 66 156 64 156 70 Z" fill="#C9A227"/>
    <path d="M100 28 L114 44 L100 60 L86 44 Z" fill="#C9A227"/>
  </svg></div>
  <div class="cell"><span>G · 3mm</span>
  <svg viewBox="0 0 200 200">
    <defs><clipPath id="pent2"><path d="M100 16 L180 74 L149 170 L51 170 L20 74 Z"/></clipPath></defs>
    <path d="M100 16 L180 74 L149 170 L51 170 L20 74 Z" fill="#C9A227"/>
    <g clip-path="url(#pent2)">
      <path d="M140 106 L88 106 C72 106 64 116 64 126 C64 138 76 146 92 146 C110 146 126 136 134 122"
            fill="none" stroke="#0B0B0C" stroke-width="11" stroke-linecap="round"/>
      <path d="M100 70 L109 80 L100 90 L91 80 Z" fill="#0B0B0C"/>
    </g>
  </svg></div>
  <div class="cell"><span>H · 3mm</span>
  <svg viewBox="0 0 200 200">
    <path d="M158 72 L80 72 C50 72 34 94 34 118 C34 146 60 162 92 162"
          fill="none" stroke="#C9A227" stroke-width="16" stroke-linecap="round"/>
    <path d="M100 30 L113 45 L100 60 L87 45 Z" fill="#C9A227"/>
  </svg></div>
</div>

</body>
</html>
